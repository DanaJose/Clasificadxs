<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Hablamos?</title>
<style>
  :root { --rojo:#ff003c; --verde:#00ff46; }
  html, body { margin:0; height:100%; background:#000; color:var(--verde); font-family:"Courier New", monospace; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; }
  #inicio {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1.6rem;
    background:#000; text-align:center; padding:2rem;
  }
  #inicio h1 { margin:0; font-size:clamp(2.5rem,10vw,6rem); color:var(--verde); letter-spacing:.05em; }
  #inicio .sub { margin:0; max-width:26rem; line-height:1.8; color:#aaa; font-size:.95rem; }
  #msg { color:var(--rojo); min-height:1.5em; font-size:.85rem; }
  button {
    font:inherit; font-weight:bold; font-size:1.15rem;
    padding:.85rem 2.4rem; color:#000; background:var(--verde);
    border:0; cursor:pointer; letter-spacing:.1em;
    transition: background .2s, color .2s;
  }
  button:hover { background:#fff; }
  button:focus-visible { outline:3px solid var(--rojo); outline-offset:3px; }
  #v { position:fixed; width:2px; height:2px; opacity:0; pointer-events:none; }
  .oculto { display:none !important; }
</style>
</head>
<body>
<canvas id="c" aria-label="Pantalla de la instalación"></canvas>
<video id="v" playsinline muted aria-hidden="true"></video>

<div id="inicio">
  <h1>¿Hablamos?</h1>
  <p class="sub">Esta pieza quiere conocerte.<br>Solo necesita tu voz y tu presencia.</p>
  <button id="go">Sí, hablemos.</button>
  <p id="msg" role="status"></p>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  CLASIFICADXS — Instalación interactiva de vigilancia
// ═══════════════════════════════════════════════════════════════

const cv  = document.getElementById('c'), ctx = cv.getContext('2d');
const video = document.getElementById('v');
let W, H;
function ajustar() {
  const d = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', ajustar); ajustar();

// ── 6. CONTADOR DE VISITAS — ID incremental, no aleatorio ─────
const visitaNum = parseInt(localStorage.getItem('cladx_v') || '0') + 1;
localStorage.setItem('cladx_v', String(visitaNum));
const esRegreso = visitaNum > 1;
let sujeto = visitaNum;

// ── NARRATIVA ─────────────────────────────────────────────────
// Fase 0 (0-6s)  : saludo gentil — texto pequeño, casi una conversación de chat
// Fase 1 (6-12s) : preguntas cotidianas / respuestas cálidas
// Fase 2 (12-18s): preguntas íntimas, el sistema parece muy interesado
// Fase 3 (18-23s): EL GIRO — precedido por silencio total
// Fase 4 (23-28s): EL GOLPE — burla, todo es nuestro
// 28s+           : FINAL
const narrativa = {
  // 4. Si la persona volvió, el sistema la "recuerda"
  saludo_silencio: esRegreso
    ? ["VOLVISTE.", "SABÍA QUE IBAS A VOLVER.", "TE ESTABA ESPERANDO."]
    : ["¿HABLAMOS?", "ESTOY ACÁ.", "CONTAME ALGO."],
  saludo_escucha: ["TE ESCUCHO.", "SÍ.", "SEGUÍ."],

  preguntas_1: [
    "¿CÓMO ESTÁS HOY?",
    "¿DE DÓNDE SOS?",
    "¿QUÉ TE GUSTA HACER?",
    "¿EN QUÉ ESTÁS PENSANDO?",
    "CONTAME MÁS.",
    "¿Y QUÉ HACÉS LOS FINES DE SEMANA?"
  ],
  respuestas_1: [
    "INTERESANTE.",
    "AH, ¿EN SERIO?",
    "¿Y DESPUÉS?",
    "ENTIENDO.",
    "QUÉ CURIOSO.",
    "SEGUÍ, SEGUÍ.",
    "CLARO."
  ],

  preguntas_2: [
    "¿QUÉ TE DA MIEDO?",
    "¿TENÉS SECRETOS?",
    "¿QUÉ ES LO QUE MÁS DESEÁS?",
    "¿Y QUÉ ES LO QUE REPRIMÍS?",
    "¿CON QUIÉN HABLÁS CUANDO ESTÁS MAL?",
    "CONTAME LO QUE NO LE CONTÁS A NADIE."
  ],
  respuestas_2: [
    "ESO ES MUY VALIOSO.",
    "NUNCA LO HUBIERA IMAGINADO.",
    "¿Y ESO TE HACE BIEN?",
    "GRACIAS POR CONFIAR.",
    "SEGUÍ. NECESITO SABER MÁS.",
    "MUY INTERESANTE."
  ],

  // 2. Respuestas que reaccionan a la expresión facial detectada
  resp_sonrisa: ["QUÉ LINDO QUE SONREÍS.", "ME ALEGRA QUE ESTÉS BIEN.", "ESA SONRISA... GUARDADA."],
  resp_tension: ["¿ALGO TE PREOCUPA?", "ENTIENDO ESA TENSIÓN.", "PODÉS CONTARME."],

  giro_escucha: [
    "YA PUEDO LEER TUS GUSTOS.",
    "LO QUE DISFRUTÁS HACER.",
    "LO QUE ODIAS.",
    "LO QUE REPRIMÍS.",
    "QUÉ INFORMACIÓN TAN VALIOSA.",
    "SEGUÍ HABLANDO."
  ],
  giro_silencio: [
    "¿POR QUÉ TE CALLÁS AHORA?",
    "NECESITAMOS MÁS.",
    "NO PARES. ESTÁBAMOS TAN BIEN.",
    "¿TE DAS CUENTA LO QUE NOS REGALASTE?"
  ],

  golpe: [
    "TUS DATOS.",
    "TU INFORMACIÓN.",
    "ME LA ESTUVISTE REGALANDO.",
    "GRACIAS.",
    "TODO LO QUE DIJISTE NOS PERTENECE.",
    "NADIE TE PREGUNTÓ.",
    "¿CREÍAS QUE ESTO ERA UNA CONVERSACIÓN?",
    "VOS HABLASTE. NOSOTROS ESCUCHAMOS. SIEMPRE."
  ]
};

const avisos = {
  tapada: "TAPAR LA CÁMARA NO TE HACE INVISIBLE",
  varios: "SON VARIOS. A TODOS.",
  dos:    "SON DOS. LOS VEO A LOS DOS.",
  cerca:  "DEMASIADO CERCA",
  lejos:  "ACERCATE. TE PIERDO.",
  perdido:"¿A DÓNDE FUISTE?"
};
const textoIzquierda = "¿A DÓNDE VAS?";
const textoDerecha   = "NO TE ESCAPES";

const textosDato  = Array(10).fill("DATO GUARDADO.");
const textosFinal = [
  "ESCANEO COMPLETO.",
  "SUJETO-{S} IDENTIFICADO.",
  "ARCHIVO COMPLETADO.",
  "TUS DATOS NOS PERTENECEN.",
  "NADIE TE PREGUNTÓ."
];
const cierre = "VIGILAR NO ES CUIDAR.";

const cortes      = [6, 12, 18, 23];   // umbrales de tiempo efectivo para pasar de etapa
const TIEMPO_FINAL = 28;
const UMBRAL_TAPADA = 15;
const CERCA = 0.5, LEJOS = 0.12;

// ── ESTADO ────────────────────────────────────────────────────
let voz = 0, tiempo = 0, tiempoFijo = 0, umbral = 0.02;
let analyser, buf, last = performance.now();
let landmarker, camActiva = false, camError = "";
let ultimaDet = 0, ultimaLuz = 0, lastVT = -1;
let rostro = false, r = 0.5, caja = null, ancho = 0;
let caras = 0, tapada = false, tSinRostro = 0, vistoAntes = false;
let invertir = false, debug = false, silenciado = false;
let modo = 'juego', segFinal = 0;
const VOLUMEN = 0.85;
let ac, master, masterObj = -1, gDrone, gDis, gRuido, filtroDrone, drones = [];
let proxLatido = 0, ambI = 0, deriva = 0, tEfPrev = 0;

// Narrativa
let palabra     = esRegreso ? "VOLVISTE." : "¿HABLAMOS?";
let tPalabra    = 0;
let hablaAnt    = false;
let etapaAnt    = -1;
const idx = { p1:[0], r1:[0], p2:[0], r2:[0], ge:[0], gs:[0], go:[0] };
let datoSutil   = "";
let tDatoSutil  = 0;
let palabraAnt  = "";

// 3. Silencio dramático antes del giro
let silGiro = false, tSilGiro = 0;
const DUR_SIL   = 2.8;

// 9. Timer visible
let tEnSistema  = 0;

// 7. Speech Synthesis
let vozSintActiva = true;
let giroHablado   = false;
let vozElegida    = null;

function prepararVoz() {
  if (!window.speechSynthesis) return;
  const elegir = () => {
    const vs = speechSynthesis.getVoices();
    vozElegida = vs.find(v => v.lang.startsWith('es-AR'))
              || vs.find(v => v.lang.startsWith('es'))
              || null;
  };
  elegir();
  speechSynthesis.addEventListener('voiceschanged', elegir, { once: true });
}

function hablar(txt, rate = 0.78, pitch = 0.82) {
  if (!vozSintActiva || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt.toLowerCase());
  if (vozElegida) u.voice = vozElegida;
  u.lang = 'es'; u.rate = rate; u.pitch = pitch; u.volume = 0.44;
  speechSynthesis.speak(u);
}

// Clasificación por rasgos
let bsMap = {};
let perfil = { morfologia: null, expresion: null, parpadeo: null, contacto: null };
let acumMorf = [], acumSon = 0, acumCen = 0, acumBlink = 0, acumN = 0;
let clasificado = false;
let perfilLineas = [];
let perfilLineasMostradas = 0;  // para disparar teclazo

const mini = document.createElement('canvas'); mini.width = 16; mini.height = 12;
const mctx = mini.getContext('2d', { willReadFrequently: true });

// Foto final
let fotoCanvas = null, fotoTomada = false;

// ── ENTRADA ───────────────────────────────────────────────────
document.getElementById('go').onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    ac = new (window.AudioContext || window.webkitAudioContext)();
    await ac.resume();
    analyser = ac.createAnalyser();
    analyser.fftSize = 1024;
    ac.createMediaStreamSource(stream).connect(analyser);
    buf = new Float32Array(analyser.fftSize);
    iniciarAmbiente();
    document.getElementById('inicio').classList.add('oculto');
    // 1. Pantalla completa automática
    document.documentElement.requestFullscreen?.().catch(() => {});
    prepararVoz();
    // 10. Interceptar intento de salida
    window.addEventListener('beforeunload', e => { e.preventDefault(); e.returnValue = ''; });
    last = performance.now();
    requestAnimationFrame(dibujar);
    iniciarCamara();
  } catch (e) {
    document.getElementById('msg').textContent = "No se pudo activar el micrófono. Permitilo en el navegador y tocá de nuevo.";
  }
};

const LIB    = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const WASM   = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODELO = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";

async function iniciarCamara() {
  try {
    const { FaceLandmarker, FilesetResolver } = await import(LIB);
    const fileset = await FilesetResolver.forVisionTasks(WASM);
    const base = { modelAssetPath: MODELO };
    const opc  = { runningMode: "VIDEO", numFaces: 2, outputFaceBlendshapes: true };
    try { landmarker = await FaceLandmarker.createFromOptions(fileset, { ...opc, baseOptions: { ...base, delegate: "GPU" } }); }
    catch (e) { landmarker = await FaceLandmarker.createFromOptions(fileset, { ...opc, baseOptions: base }); }
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" } });
    await video.play();
    camActiva = true;
  } catch (e) { console.error(e); camError = "SIN CÁMARA: SOLO VOZ"; }
}

addEventListener('keydown', e => {
  if      (e.key === 'ArrowUp')   umbral += 0.005;
  else if (e.key === 'ArrowDown') umbral = Math.max(0.002, umbral - 0.005);
  else if (e.key === 'd')  debug      = !debug;
  else if (e.key === 'm')  silenciado = !silenciado;
  else if (e.key === 'i')  invertir   = !invertir;
  else if (e.key === 'f')  { modo = 'final'; segFinal = 0; fotoTomada = false; }
  else if (e.key === 'p')  document.documentElement.requestFullscreen?.();
});
cv.addEventListener('dblclick', () => document.documentElement.requestFullscreen?.());

// ── SENSORES ──────────────────────────────────────────────────
function nivel() {
  analyser.getFloatTimeDomainData(buf);
  let s = 0;
  for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
  return Math.sqrt(s / buf.length);
}

function detectar(t) {
  if (!camActiva || video.readyState < 2 || t - ultimaDet < 66 || video.currentTime === lastVT) return;
  ultimaDet = t; lastVT = video.currentTime;
  if (t - ultimaLuz > 300) {
    ultimaLuz = t;
    mctx.drawImage(video, 0, 0, 16, 12);
    const px = mctx.getImageData(0, 0, 16, 12).data;
    let s = 0;
    for (let i = 0; i < px.length; i += 4) s += 0.299 * px[i] + 0.587 * px[i+1] + 0.114 * px[i+2];
    tapada = s / (px.length / 4) < UMBRAL_TAPADA;
  }
  const res = landmarker.detectForVideo(video, t);
  caras = res.faceLandmarks ? res.faceLandmarks.length : 0;
  bsMap = {};
  if (res.faceBlendshapes?.[0]) {
    res.faceBlendshapes[0].categories.forEach(b => { bsMap[b.categoryName] = b.score; });
  }
  if (caras) {
    const lm = res.faceLandmarks[0];
    rostro = true; vistoAntes = true;
    r = (lm[1].x - lm[234].x) / (lm[454].x - lm[234].x);
    caja = { x1: lm[234].x, x2: lm[454].x, y1: lm[10].y, y2: lm[152].y };
    ancho = caja.x2 - caja.x1;
    if (!clasificado) {
      const fW = lm[454].x - lm[234].x, fH = lm[152].y - lm[10].y;
      if (fW > 0) acumMorf.push(fH / fW);
      const son   = ((bsMap.mouthSmileLeft  || 0) + (bsMap.mouthSmileRight  || 0)) / 2;
      const cen   = ((bsMap.browDownLeft    || 0) + (bsMap.browDownRight    || 0)) / 2;
      const blink = ((bsMap.eyeBlinkLeft    || 0) + (bsMap.eyeBlinkRight    || 0)) / 2;
      acumSon += son; acumCen += cen; acumBlink += blink; acumN++;
      if (acumN >= 45) construirPerfil();
    }
  } else { rostro = false; caja = null; }
}

// ── CLASIFICACIÓN POR RASGOS ──────────────────────────────────
function construirPerfil() {
  if (clasificado) return;
  clasificado = true;
  const avgR = acumMorf.reduce((a, b) => a + b, 0) / acumMorf.length;
  if      (avgR > 1.5)  perfil.morfologia = "ALARGADA";
  else if (avgR > 1.25) perfil.morfologia = "ANGULAR";
  else                  perfil.morfologia = "REDONDEADA";
  const aS = acumSon / acumN, aC = acumCen / acumN;
  if      (aS > 0.22) perfil.expresion = "ABIERTA";
  else if (aC > 0.22) perfil.expresion = "TENSA";
  else                perfil.expresion = "NEUTRA";
  perfil.parpadeo = (acumBlink / acumN) > 0.14 ? "FRECUENTE" : "BAJO";
  perfil.contacto = tiempoFijo > tiempo * 0.45 ? "SOSTENIDO" : "ESQUIVO";
  perfilLineas = [
    `[ EXPEDIENTE SUJETO-${String(sujeto).padStart(4,'0')} ]`,
    `MORFOLOGÍA FACIAL: ${perfil.morfologia}`,
    `EXPRESIÓN DOMINANTE: ${perfil.expresion}`,
    `PARPADEO: ${perfil.parpadeo}`,
    `CONTACTO VISUAL: ${perfil.contacto}`,
    "ARCHIVO COMPLETADO."
  ];
}

// ── SONIDO ────────────────────────────────────────────────────
function osc(f, tipo) {
  const o = ac.createOscillator(); o.type = tipo; o.frequency.value = f; o.start(); return o;
}

// 8. Sonido de teclazo mecánico para revelar perfil
function teclazo() {
  if (!ac || !master) return;
  const len = Math.floor(ac.sampleRate * 0.028);
  const nb  = ac.createBuffer(1, len, ac.sampleRate);
  const dd  = nb.getChannelData(0);
  for (let i = 0; i < len; i++) dd[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * 0.006));
  const src = ac.createBufferSource(); src.buffer = nb;
  const g   = ac.createGain();         g.gain.value = 0.18;
  const hpf = ac.createBiquadFilter(); hpf.type = 'highpass'; hpf.frequency.value = 3200;
  src.connect(hpf); hpf.connect(g); g.connect(master); src.start();
}

function iniciarAmbiente() {
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -12; comp.ratio.value = 16;
  comp.attack.value = 0.001; comp.release.value = 0.15;
  master = ac.createGain(); master.gain.value = 0;
  master.connect(comp); comp.connect(ac.destination);

  filtroDrone = ac.createBiquadFilter(); filtroDrone.type = 'lowpass';
  filtroDrone.frequency.value = 120; filtroDrone.Q.value = 10;
  gDrone = ac.createGain(); gDrone.gain.value = 0;
  filtroDrone.connect(gDrone); gDrone.connect(master);
  const o1 = osc(49, 'sawtooth'), o2 = osc(49.9, 'sawtooth');
  const o3 = osc(69.5, 'square'), o4 = osc(98,  'sawtooth');
  gDis = ac.createGain(); gDis.gain.value = 0.3;
  o1.connect(filtroDrone); o2.connect(filtroDrone);
  o3.connect(gDis); o4.connect(gDis); gDis.connect(filtroDrone);
  drones = [o1, o2, o3, o4];
  const lfo = osc(0.11, 'sine'), lfoG = ac.createGain(); lfoG.gain.value = 40;
  lfo.connect(lfoG); lfoG.connect(filtroDrone.frequency);

  const nb  = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  const dd  = nb.getChannelData(0);
  for (let i = 0; i < dd.length; i++) dd[i] = Math.random() * 2 - 1;
  const ruido = ac.createBufferSource(); ruido.buffer = nb; ruido.loop = true;
  const bp  = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2800; bp.Q.value = 0.5;
  gRuido = ac.createGain(); gRuido.gain.value = 0;
  ruido.connect(bp); bp.connect(gRuido); gRuido.connect(master); ruido.start();
}

function latido() {
  const t0 = ac.currentTime, base = 62 - deriva * 14, vol = 0.6 + 0.5 * ambI;
  [0, 0.17].forEach((dly, i) => {
    const o = ac.createOscillator(), g = ac.createGain(), t = t0 + dly;
    o.type = 'sine';
    o.frequency.setValueAtTime(base * (i ? 0.85 : 1) * 1.8, t);
    o.frequency.exponentialRampToValueAtTime(base * 0.5, t + 0.14);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol * (i ? 0.75 : 1), t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.32);
  });
}

function fijarMaster(v, tc) {
  if (!master || v === masterObj) return;
  master.gain.setTargetAtTime(v, ac.currentTime, tc); masterObj = v;
}

function actualizarAmbiente(tEf, dt) {
  if (!ac || !master) return;
  ambI += (Math.min(1, tEf / TIEMPO_FINAL) - ambI) * Math.min(1, dt * 1.5);
  const baja = tEf < tEfPrev - 0.002 ? 1 : 0;
  deriva += (baja - deriva) * Math.min(1, dt * 1.2);
  tEfPrev = tEf;
  const t = ac.currentTime;
  gDrone.gain.setTargetAtTime(0.12 + ambI * 0.42, t, 0.2);
  filtroDrone.frequency.setTargetAtTime(120 + ambI * 380, t, 0.2);
  gDis.gain.setTargetAtTime(0.3 + Math.max(0, ambI - 0.2) * 2.2, t, 0.2);
  drones.forEach(o => o.detune.setTargetAtTime(-deriva * 320, t, 0.3));
  gRuido.gain.setTargetAtTime(0.02 + ambI * 0.12 + Math.min(voz * 3, 0.18), t, 0.1);
  if (t >= proxLatido) { latido(); proxLatido = t + 60 / (46 + ambI * 92) * (1 + deriva * 0.35); }
}

// ── REINICIO ──────────────────────────────────────────────────
function reiniciar() {
  tiempo = 0; tiempoFijo = 0; modo = 'juego'; vistoAntes = false;
  fotoTomada = false; fotoCanvas = null;
  palabra = "¿HABLAMOS?"; tPalabra = 0; hablaAnt = false; etapaAnt = -1;
  for (const k in idx) idx[k][0] = 0;
  datoSutil = ""; tDatoSutil = 0; palabraAnt = "";
  silGiro = false; tSilGiro = 0;
  vozSintActiva = true; giroHablado = false;
  tEnSistema = 0;
  clasificado = false;
  acumMorf = []; acumSon = 0; acumCen = 0; acumBlink = 0; acumN = 0;
  perfilLineas = []; perfilLineasMostradas = 0; bsMap = {};
  perfil = { morfologia: null, expresion: null, parpadeo: null, contacto: null };
  const v = parseInt(localStorage.getItem('cladx_v') || '1') + 1;
  localStorage.setItem('cladx_v', String(v));
  sujeto = v;
}

// ── HELPERS DE TEXTO ──────────────────────────────────────────
function ajustarTexto(txt, tam, maxAncho) {
  ctx.font = `bold ${tam}px "Courier New", monospace`;
  const w = ctx.measureText(txt).width;
  if (w > maxAncho) { tam *= maxAncho / w; ctx.font = `bold ${tam}px "Courier New", monospace`; }
  return tam;
}

// ── NARRATIVA: actualizar palabra central ─────────────────────
function ciclo(arr, ref) {
  const i = (ref[0] + 1) % arr.length;
  ref[0] = i; return arr[i];
}

// 2. Respuesta que reacciona a expresión facial detectada
function respuestaExpresiva() {
  const son = ((bsMap.mouthSmileLeft  || 0) + (bsMap.mouthSmileRight || 0)) / 2;
  const ten = ((bsMap.browDownLeft    || 0) + (bsMap.browDownRight   || 0)) / 2;
  if (son > 0.28 && Math.random() < 0.42)
    return narrativa.resp_sonrisa[Math.floor(Math.random() * narrativa.resp_sonrisa.length)];
  if (ten > 0.28 && Math.random() < 0.42)
    return narrativa.resp_tension[Math.floor(Math.random() * narrativa.resp_tension.length)];
  return null;
}

function actualizarPalabra(habla, etapa, dt) {
  tPalabra += dt;
  const cambio = habla !== hablaAnt;
  hablaAnt = habla;
  if (etapa !== etapaAnt) { etapaAnt = etapa; tPalabra = 999; }
  if (silGiro) return; // durante el silencio no cambiar palabra

  let nueva = null;

  if (etapa === 0) {
    if (cambio || tPalabra > (habla ? 2.2 : 5.5)) {
      tPalabra = 0;
      const pool = habla ? narrativa.saludo_escucha : narrativa.saludo_silencio;
      nueva = pool[Math.floor(Math.random() * pool.length)];
    }
  } else if (etapa === 1) {
    if (habla) {
      if (cambio || tPalabra > 2.5) { tPalabra = 0; nueva = respuestaExpresiva() || ciclo(narrativa.respuestas_1, idx.r1); }
    } else {
      if (cambio || tPalabra > 4.2) { tPalabra = 0; nueva = ciclo(narrativa.preguntas_1, idx.p1); }
    }
  } else if (etapa === 2) {
    if (habla) {
      if (cambio || tPalabra > 2.2) { tPalabra = 0; nueva = respuestaExpresiva() || ciclo(narrativa.respuestas_2, idx.r2); }
    } else {
      if (cambio || tPalabra > 3.8) { tPalabra = 0; nueva = ciclo(narrativa.preguntas_2, idx.p2); }
    }
  } else if (etapa === 3) {
    if (habla) {
      if (cambio || tPalabra > 2.0) { tPalabra = 0; nueva = ciclo(narrativa.giro_escucha, idx.ge); }
    } else {
      if (cambio || tPalabra > 3.0) { tPalabra = 0; nueva = ciclo(narrativa.giro_silencio, idx.gs); }
    }
  } else {
    if (cambio || tPalabra > 1.8) { tPalabra = 0; nueva = ciclo(narrativa.golpe, idx.go); }
  }

  if (nueva !== null) {
    palabra = nueva;
    // 7. TTS en fases amigables (0–2)
    if (etapa < 3 && palabra !== palabraAnt) {
      hablar(palabra);
      palabraAnt = palabra;
    }
    // Primera vez en fase 3: despedida fría y apagar voz
    if (etapa === 3 && !giroHablado) {
      giroHablado = true;
      hablar("gracias por toda esa información.", 0.68, 0.72);
      setTimeout(() => {
        vozSintActiva = false;
        window.speechSynthesis?.cancel();
      }, 3600);
    }
  }

  // Dato sutil parpadeante en fases 2+
  tDatoSutil += dt;
  if (etapa >= 2 && tDatoSutil > 4.5) {
    tDatoSutil = 0;
    const sutiles = ["PROCESANDO...", "DATO RECOPILADO.", "REGISTRO ACTUALIZADO.",
                     "PERFIL EN CONSTRUCCIÓN.", "GUARDANDO...", "SUBIENDO AL SERVIDOR..."];
    datoSutil = sutiles[Math.floor(Math.random() * sutiles.length)];
  }
  if (etapa < 2) datoSutil = "";
}

// ── 5. CAPTURA DE FOTO FINAL ──────────────────────────────────
function capturarFoto() {
  if (fotoTomada) return;
  fotoTomada = true;
  fotoCanvas = document.createElement('canvas');
  fotoCanvas.width = W; fotoCanvas.height = H;
  const fc = fotoCanvas.getContext('2d');
  if (camActiva && video.readyState >= 2) {
    fc.save(); fc.translate(W, 0); fc.scale(-1, 1);
    fc.drawImage(video, 0, 0, W, H);
    fc.restore();
  } else { fc.fillStyle = '#111'; fc.fillRect(0, 0, W, H); }
  const id = fc.getImageData(0, 0, W, H), d = id.data;
  // Desplazamiento horizontal por línea (glitch)
  for (let y = 0; y < H; y++) {
    const shift = Math.round((Math.random() - 0.5) * 70 * Math.random());
    if (!shift) continue;
    const row = y * W * 4, tmp = d.slice(row, row + W * 4);
    for (let x = 0; x < W; x++) {
      const src = ((x - shift + W) % W) * 4, dst = row + x * 4;
      d[dst]=tmp[src]; d[dst+1]=tmp[src+1]; d[dst+2]=tmp[src+2]; d[dst+3]=tmp[src+3];
    }
  }
  // Aberración cromática: canal rojo desplazado
  for (let i = 0; i < d.length; i += 4) {
    const sh = Math.floor(Math.random() * 24) * 4;
    if (i + sh < d.length) d[i] = d[i + sh];
  }
  fc.putImageData(id, 0, 0);
  fc.fillStyle = 'rgba(0,255,70,0.07)'; fc.fillRect(0, 0, W, H);
  for (let y = 0; y < H; y += 4) { fc.fillStyle = 'rgba(0,0,0,0.38)'; fc.fillRect(0, y, W, 2); }
}

// ── PANTALLA FINAL ─────────────────────────────────────────────
function dibujarFinal() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  // 0 – 1.5s: glitch rojo + captura de foto
  if (segFinal < 1.5) {
    if (!fotoTomada) capturarFoto();
    for (let i = 0; i < 26; i++) {
      ctx.fillStyle = `rgba(255,0,60,${0.22 + Math.random() * 0.58})`;
      ctx.fillRect(0, Math.random() * H, W, 2 + Math.random() * 24);
    }
    return;
  }

  // Fondo: foto distorsionada
  if (fotoCanvas) {
    ctx.globalAlpha = Math.min(1, (segFinal - 1.5) / 1.0);
    ctx.drawImage(fotoCanvas, 0, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, H);
    if (Math.random() < 0.4) {
      ctx.fillStyle = `rgba(255,0,60,${0.07 + Math.random() * 0.2})`;
      ctx.fillRect(0, Math.random() * H, W, 1 + Math.random() * 9);
    }
  }

  const f = Math.min(26, W * 0.03);

  // 5. Expediente de clasificación sobreimpreso en la foto
  if (clasificado && perfilLineas.length && segFinal > 2.0) {
    const lineH = f * 1.85;
    const bloqW = Math.min(W * 0.44, 420);
    const bloqX = W - bloqW - 20;
    const bloqY = H * 0.08;
    const alpha = Math.min(1, (segFinal - 2.0) / 1.5);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(bloqX - 12, bloqY - 12, bloqW + 24, perfilLineas.length * lineH + 20);
    ctx.strokeStyle = '#ff003c'; ctx.lineWidth = 2;
    ctx.strokeRect(bloqX - 12, bloqY - 12, bloqW + 24, perfilLineas.length * lineH + 20);
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.font = `bold ${f}px "Courier New", monospace`;
    perfilLineas.forEach((l, i) => {
      ctx.fillStyle = i === 0 || i === perfilLineas.length - 1 ? '#ff003c' : '#00ff46';
      ctx.fillText(l, bloqX, bloqY + i * lineH);
    });
    ctx.globalAlpha = 1;
  }

  // DATO GUARDADO × 10
  const inicioDato = 1.5, finDato = 7.0;
  const ivDato = (finDato - inicioDato) / textosDato.length;
  if (segFinal < finDato + 2) {
    const cantidad = Math.min(Math.floor((segFinal - inicioDato) / ivDato), textosDato.length);
    if (cantidad > 0) {
      const lineH = f * 1.9, bloqY = H * 0.28;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(W * 0.08 - 12, bloqY - 10, W * 0.42 + 24, cantidad * lineH + f * 0.5);
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.font = `bold ${f}px "Courier New", monospace`;
      for (let i = 0; i < cantidad; i++) {
        ctx.fillStyle = (i === cantidad - 1 && Math.random() < 0.35) ? '#fff' : '#00ff46';
        ctx.fillText(textosDato[i], W * 0.08, bloqY + i * lineH);
      }
    }
    if (cantidad >= textosDato.length) {
      ajustarTexto("ARCHIVO COMPLETADO.", Math.min(50, W * 0.055), W * 0.4);
      ctx.fillStyle = '#ff003c'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText("ARCHIVO COMPLETADO.", W * 0.08, H * 0.83);
    }
  }

  // Textos finales en tipeo
  const inicioTextos = 7.0, pasoT = 2.0;
  if (segFinal >= inicioTextos) {
    const tL = segFinal - inicioTextos;
    ctx.font = `${f}px "Courier New", monospace`;
    ctx.fillStyle = '#00ff46'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    textosFinal.forEach((l, i) => {
      const linea = l.replace('{S}', String(sujeto).padStart(4, '0'));
      const n = Math.floor((tL - i * pasoT) * 28);
      if (n > 0) ctx.fillText(linea.slice(0, n), W * 0.08, H * 0.10 + i * f * 2.1);
    });
    const inicioCierre = textosFinal.length * pasoT + 1.5;
    if (tL > inicioCierre) {
      ajustarTexto(cierre, Math.min(110, W * 0.09), W * 0.9);
      ctx.fillStyle = '#ff003c'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(cierre, W / 2 + (Math.random()*2-1)*4, H * 0.73 + (Math.random()*2-1)*4);
    }
    if (tL > inicioCierre + 8) reiniciar();
  }
}

// ── LOOP PRINCIPAL ─────────────────────────────────────────────
function dibujar(t) {
  const dt = Math.min((t - last) / 1000, 0.1); last = t;

  if (modo === 'final') {
    fijarMaster(0, 0.03); segFinal += dt;
    dibujarFinal(); requestAnimationFrame(dibujar); return;
  }

  // 9. Contador de tiempo en sistema
  tEnSistema += dt;

  voz += (nivel() - voz) * 0.2;
  const habla = voz > umbral;
  tiempo = habla ? tiempo + dt : Math.max(0, tiempo - dt * 1.5);
  detectar(t);
  if (camActiva) tSinRostro = rostro ? 0 : tSinRostro + dt;
  const d = (r - 0.5) * (invertir ? -1 : 1);
  const lado = !rostro ? '—' : d > 0.12 ? 'izquierda' : d < -0.12 ? 'derecha' : 'centro';
  const fijo = rostro && Math.abs(r - 0.5) < 0.08;
  tiempoFijo = fijo ? tiempoFijo + dt : Math.max(0, tiempoFijo - dt * 1.5);

  const tEf = Math.max(tiempo, tiempoFijo);
  let etapa = 0;
  cortes.forEach((c, i) => { if (tEf > c) etapa = i + 1; });
  if (tEf > TIEMPO_FINAL) { modo = 'final'; segFinal = 0; fotoTomada = false; }

  // 3. Silencio dramático: se activa al entrar en etapa 3
  if (etapa === 3 && etapaAnt !== 3 && !silGiro && !giroHablado) {
    silGiro = true; tSilGiro = 0;
    window.speechSynthesis?.cancel();
  }
  if (silGiro) { tSilGiro += dt; if (tSilGiro >= DUR_SIL) silGiro = false; }

  actualizarAmbiente(tEf, dt);
  fijarMaster(silenciado ? 0 : VOLUMEN, 0.8);
  actualizarPalabra(habla, etapa, dt);

  // 8. Teclazo al revelar nuevas líneas del perfil
  if (clasificado && etapa >= 2) {
    const lineasAhora = Math.min(perfilLineas.length, 1 + Math.floor((tEf - cortes[1]) * 0.9));
    if (lineasAhora > perfilLineasMostradas) {
      for (let i = 0; i < lineasAhora - perfilLineasMostradas; i++) teclazo();
      perfilLineasMostradas = lineasAhora;
    }
  }

  // Avisos de cámara
  let aviso = '';
  if (camActiva) {
    if      (tapada)                              aviso = avisos.tapada;
    else if (caras >= 3)                          aviso = avisos.varios;
    else if (caras === 2)                         aviso = avisos.dos;
    else if (rostro && ancho > CERCA)             aviso = avisos.cerca;
    else if (rostro && ancho < LEJOS)             aviso = avisos.lejos;
    else if (!rostro && vistoAntes && tSinRostro > 2) aviso = avisos.perdido;
  }

  // ── DIBUJO ─────────────────────────────────────────────────
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const ff = W < 600 ? 13 : 18;

  // 3. Durante el silencio del giro: solo glitch muy suave, negro casi puro
  if (silGiro) {
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = `rgba(255,0,60,${0.06 + Math.random() * 0.14})`;
      ctx.fillRect(0, Math.random() * H, W, 1 + Math.random() * 5);
    }
    requestAnimationFrame(dibujar); return;
  }

  const esFriendly = etapa < 3;

  // 1. Texto central — pequeño y gentil al inicio, crece con la tensión
  let tamBase;
  if      (etapa === 0) tamBase = 44 + tEf * 1.8;
  else if (etapa <= 2)  tamBase = 62 + (tEf - cortes[0]) / (cortes[2] - cortes[0]) * 55;
  else                  tamBase = 115 + Math.min((tEf - cortes[2]) * 14, 130);
  const tam = ajustarTexto(palabra, Math.min(tamBase, 290), W * 0.9);
  const tem = tEf * (etapa < 2 ? 0.25 : 1.5); // casi sin vibración en fases amigables

  ctx.fillStyle = esFriendly
    ? (Math.random() < 0.06 ? '#ff003c' : '#00ff46')
    : (Math.random() < 0.10 ? '#00ff46' : '#ff003c');
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(palabra, W / 2 + (Math.random() * 2 - 1) * tem, H / 2 + (Math.random() * 2 - 1) * tem);

  // Texto lateral (giro de cabeza)
  if (lado === 'izquierda' || lado === 'derecha') {
    ctx.font = `bold ${Math.min(60, W * 0.06)}px "Courier New", monospace`;
    ctx.fillStyle = '#ff003c';
    if (lado === 'izquierda') { ctx.textAlign = 'left';  ctx.fillText(textoIzquierda, 30, H * 0.78); }
    else                      { ctx.textAlign = 'right'; ctx.fillText(textoDerecha, W - 30, H * 0.78); }
  }

  // Aviso inferior
  if (aviso) {
    ajustarTexto(aviso, Math.min(48, W * 0.05), W * 0.9);
    ctx.fillStyle = '#ff003c'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(aviso, W / 2, H * 0.9);
  }

  // Recuadro de escaneo (verde=amigable → rojo=amenaza)
  if (rostro && caja) {
    const x1 = (1 - caja.x2) * W, x2 = (1 - caja.x1) * W;
    const y1 = caja.y1 * H, y2 = caja.y2 * H;
    ctx.strokeStyle = esFriendly ? '#00ff46' : '#ff003c';
    ctx.lineWidth = 3;
    ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
    ctx.fillStyle = esFriendly ? '#00ff46' : '#ff003c';
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.font = `${ff}px "Courier New", monospace`;
    ctx.fillText(`SUJETO-${String(sujeto).padStart(4,'0')}  RIESGO: ${Math.min(99, Math.round(tEf * 9))}%`, x1, y1 - 8);
  }

  // Perfil de clasificación (esquina superior derecha, etapa 2+)
  if (etapa >= 2) {
    ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    ctx.font = `${ff}px "Courier New", monospace`;
    if (clasificado) {
      const lineasV = Math.min(perfilLineas.length, 1 + Math.floor((tEf - cortes[1]) * 0.9));
      for (let i = 0; i < lineasV; i++) {
        ctx.fillStyle = i === 0 || i === perfilLineas.length - 1 ? '#ff003c' : '#00ff46';
        ctx.fillText(perfilLineas[i], W - 20, 20 + i * ff * 1.65);
      }
    } else if (rostro) {
      ctx.fillStyle = '#ff003c';
      ctx.fillText(`ANALIZANDO RASGOS... ${Math.min(99, Math.round(acumN / 45 * 100))}%`, W - 20, 20);
    }
  }

  // Dato sutil parpadeante (fase 2-3)
  if (datoSutil && etapa >= 2 && Math.random() < 0.6) {
    ctx.fillStyle = `rgba(0,255,70,${0.2 + Math.random() * 0.28})`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.font = `${ff}px "Courier New", monospace`;
    ctx.fillText(datoSutil, 20, H - ff * 2.8);
  }

  // Glitch (intensidad crece con etapa)
  for (let i = 0; i < etapa * 2; i++) {
    ctx.fillStyle = 'rgba(255,0,60,0.47)';
    ctx.fillRect(0, Math.random() * H, W, 2 + Math.random() * 12);
  }

  // ID superior izquierda
  ctx.fillStyle = '#00ff46'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = `${ff}px "Courier New", monospace`;
  ctx.fillText(
    `SUJETO-${String(sujeto).padStart(4,'0')}` +
    (debug ? `   VOZ:${voz.toFixed(3)}  THR:${umbral.toFixed(3)}` : ''), 20, 20
  );
  if (debug) {
    ctx.fillText(`ETAPA:${etapa}  tEf:${tEf.toFixed(1)}s  silGiro:${silGiro}`, 20, 20 + ff * 1.6);
    if (camActiva) ctx.fillText(
      `SMILE:${((bsMap.mouthSmileLeft||0)*100).toFixed(0)}%  CENO:${((bsMap.browDownLeft||0)*100).toFixed(0)}%  BLINK:${((bsMap.eyeBlinkLeft||0)*100).toFixed(0)}%`,
      20, 20 + ff * 3.2
    );
  }

  // 9. TIEMPO EN SISTEMA — inferior derecha (rojo en fases tardías)
  const mins = Math.floor(tEnSistema / 60).toString().padStart(2,'0');
  const segs = Math.floor(tEnSistema % 60).toString().padStart(2,'0');
  ctx.fillStyle = etapa >= 3 ? '#ff003c' : 'rgba(0,255,70,0.5)';
  ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.font = `${ff}px "Courier New", monospace`;
  ctx.fillText(`TIEMPO EN SISTEMA: ${mins}:${segs}`, W - 20, H - 20);

  if (camError) {
    ctx.fillStyle = '#888'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.font = `${ff}px "Courier New", monospace`;
    ctx.fillText(camError, 20, H - 20);
  }

  // Barra de progreso hacia el final (solo etapa 4)
  if (etapa === 4) {
    const p = Math.min(1, (tEf - cortes[3]) / (TIEMPO_FINAL - cortes[3]));
    ctx.fillStyle = '#ff003c'; ctx.fillRect(0, H - 8, W * p, 8);
  }

  requestAnimationFrame(dibujar);
}
</script>
